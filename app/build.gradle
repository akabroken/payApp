plugins {
    id 'com.android.application'
}

// Load keystore properties safely
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    println "Success: keystore.properties file found at ${keystorePropertiesFile.path}"
} else {
    println "Warning: keystore.properties file not found at ${keystorePropertiesFile.path}"
}

android {
    compileSdk 35
    namespace = "com.isw.payapp"
    defaultConfig {
        applicationId "com.isw.payapp"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Set a default application class that will be overridden by flavors
        manifestPlaceholders = [applicationClass: "com.isw.payapp.DefaultApplication"]

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
        buildConfigField "String", "BASE_URL", "\"https://api.example.com/\""
        buildConfigField "boolean", "LOG_ENABLED", "true"
        buildConfigField "int", "TIMEOUT", "30"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        dataBinding true
    }

    // Define signing configs for each flavor
    signingConfigs {
        telpo {
            // Commented out - no signing config for telpo
            storeFile file("keystores/PAXKeystore.jks")
            storePassword keystoreProperties.getProperty('telpoStorePassword', '')
            keyAlias keystoreProperties.getProperty('telpoKeyAlias', '')
            keyPassword keystoreProperties.getProperty('telpoKeyPassword', '')

            // Debug logging
            println "TELPO Signing Config:"
            println "  Store File: ${storeFile.exists() ? 'EXISTS' : 'MISSING'} at ${storeFile.path}"
            println "  Store Password: ${storePassword ? 'SET' : 'MISSING'}"
            println "  Key Alias: ${keyAlias ?: 'MISSING'}"
            println "  Key Password: ${keyPassword ? 'SET' : 'MISSING'}"
        }

        newtelpo {
            // Commented out - no signing config for telpo
            storeFile file("keystores/PAXKeystore.jks")
            storePassword keystoreProperties.getProperty('telpoStorePassword', '')
            keyAlias keystoreProperties.getProperty('telpoKeyAlias', '')
            keyPassword keystoreProperties.getProperty('telpoKeyPassword', '')

            // Debug logging
            println "TELPO Signing Config:"
            println "  Store File: ${storeFile.exists() ? 'EXISTS' : 'MISSING'} at ${storeFile.path}"
            println "  Store Password: ${storePassword ? 'SET' : 'MISSING'}"
            println "  Key Alias: ${keyAlias ?: 'MISSING'}"
            println "  Key Password: ${keyPassword ? 'SET' : 'MISSING'}"
        }
        pax {
            // Commented out - no signing config for pax
            storeFile file("keystores/PAXKeystore.jks")
            storePassword keystoreProperties.getProperty('paxStorePassword', '')
            keyAlias keystoreProperties.getProperty('paxKeyAlias', '')
            keyPassword keystoreProperties.getProperty('paxKeyPassword', '')


            // Debug logging
            println "DSPREAD Signing Config:"
            println "  Store File: ${storeFile.exists() ? 'EXISTS' : 'MISSING'} at ${storeFile.path}"
            println "  Store Password: ${storePassword ? 'SET' : 'MISSING'}"
            println "  Key Alias: ${keyAlias ?: 'MISSING'}"
            println "  Key Password: ${keyPassword ? 'SET' : 'MISSING'}"
        }
        dspread {
            //Test signing config
//            storeFile file("keystores/mpos.keystore")
//            storePassword keystoreProperties.getProperty('dspreadStorePassword', '')
//            keyAlias keystoreProperties.getProperty('dspreadKeyAlias', '')
//            keyPassword keystoreProperties.getProperty('dspreadKeyPassword', '')
            //Production signing config
            storeFile file("keystores/mpos.jks")
            storePassword keystoreProperties.getProperty('mposStorePassword', '')
            keyAlias keystoreProperties.getProperty('mposKeyAlias', '')
            keyPassword keystoreProperties.getProperty('mposKeyPassword', '')

            // Debug logging
            println "DSPREAD Signing Config:"
            println "  Store File: ${storeFile.exists() ? 'EXISTS' : 'MISSING'} at ${storeFile.path}"
            println "  Store Password: ${storePassword ? 'SET' : 'MISSING'}"
            println "  Key Alias: ${keyAlias ?: 'MISSING'}"
            println "  Key Password: ${keyPassword ? 'SET' : 'MISSING'}"
        }
        feitian {
            storeFile file("keystores/ftdemo.jks")
            storePassword keystoreProperties.getProperty('feitianStorePassword', '')
            keyAlias keystoreProperties.getProperty('feitianKeyAlias', '')
            keyPassword keystoreProperties.getProperty('feitianKeyPassword', '')

            // Debug logging
            println "FEITIAN Signing Config:"
            println "  Store File: ${storeFile.exists() ? 'EXISTS' : 'MISSING'} at ${storeFile.path}"
            println "  Store Password: ${storePassword ? 'SET' : 'MISSING'}"
            println "  Key Alias: ${keyAlias ?: 'MISSING'}"
            println "  Key Password: ${keyPassword ? 'SET' : 'MISSING'}"
        }
        castles {
            // Commented out - no signing config for castles
        }
    }

    flavorDimensions "pos"
    productFlavors {
        telpo {
            dimension "pos"
            buildConfigField "String", "POS_BRAND", "\"TELPO\""
            buildConfigField "String", "SDK_VERSION", "\"1.0.0\""
            manifestPlaceholders = [applicationClass: "com.isw.payapp.devices.telpo.TelpoApplication"]
            // No signing config - will use debug/release default
            buildConfigField "int", "APP_LOGO", "R.drawable.bank_of_baroda"
//            buildConfigField "int", "APP_LOGO", "R.drawable.sidian_bank_logo"
            signingConfig = signingConfigs.telpo
        }
        newtelpo {
            dimension "pos"
            buildConfigField "String", "POS_BRAND", "\"NEW_TELPO\""
            buildConfigField "String", "SDK_VERSION", "\"1.0.0\""
            manifestPlaceholders = [applicationClass: "com.isw.payapp.devices.newtelpo.NewTelpoApplication"]
            // No signing config - will use debug/release default
            buildConfigField "int", "APP_LOGO", "R.drawable.consolidated_bank_logo"
//            buildConfigField "String", "APP_VERSION", "\"${versionName}\""
//            buildConfigField "int", "APP_LOGO", "R.drawable.sidian_bank_logo"
            signingConfig = signingConfigs.telpo
        }

        pax {
            dimension "pos"
            buildConfigField "String", "POS_BRAND", "\"PAX\""
            manifestPlaceholders = [applicationClass: "com.isw.payapp.devices.pax.PaxApplication"]
            // No signing config - will use debug/release default
        }
        dspread {
            dimension "pos"
            buildConfigField "String", "POS_BRAND", "\"DSPREAD\""
            buildConfigField "String", "SDK_VERSION", "\"7.4.8\""
            manifestPlaceholders = [applicationClass: "com.isw.payapp.devices.dspread.Activity.DeviceApplication"]
            signingConfig = signingConfigs.dspread  // Explicitly set signing config
            buildConfigField "int", "APP_LOGO", "R.drawable.sidian_bank_logo"
        }
        feitian {
            dimension "pos"
            buildConfigField "String", "POS_BRAND", "\"FEITIAN\""
            manifestPlaceholders = [applicationClass: "com.isw.payapp.devices.feitian.FeitianApplication"]
            signingConfig = signingConfigs.feitian  // Explicitly set signing config
            buildConfigField "int", "APP_LOGO", "R.drawable.caritas_logo_1"
        }
        castles {
            dimension "pos"
            buildConfigField "String", "POS_BRAND", "\"CASTLES\""
            buildConfigField "String", "SDK_VERSION", "\"1.0.1\""
            manifestPlaceholders = [applicationClass: "com.isw.payapp.devices.castles.CastlesApplication"]
            // No signing config - will use debug/release default
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.telpo
        }
        debug {
            // Signing config is handled by individual flavors
            signingConfig signingConfigs.dspread
        }
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/*.license', 'META-INF/DEPENDENCIES']
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.0'
    implementation 'androidx.navigation:navigation-ui:2.9.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.databinding:databinding-runtime:8.13.0'
    implementation 'androidx.activity:activity:1.10.1'

    // Network dependencies
    implementation("com.squareup.okhttp3:okhttp:5.1.0")
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp-tls:4.11.0'

    // Device-specific implementations
    telpoImplementation files('libs/telpo/telpo_api.jar')
    telpoImplementation files('libs/telpo/emv_pro4.0.jar')
    telpoImplementation files('libs/telpo/core-3.1.0.jar')

    newtelpoImplementation files('libs/newtelpo/core-3.1.0.jar')
    newtelpoImplementation files('libs/newtelpo/emvsdk_20240106.aar')
    newtelpoImplementation files('libs/newtelpo/telpoLib_v2.14.20231218.aar')

    dspreadImplementation files('libs/d60/dspread_pos_sdk_7.6.4.aar')
    dspreadImplementation files('libs/d60/dspread_print_sdk-1.7.2-beta.aar')

    feitianImplementation files('libs/feitian/FTSDK_api_V1.0.1.15_20250306.jar')
    feitianImplementation files('libs/feitian/FTMDB_api_V1.0.0_20241017.jar')
    feitianImplementation files('libs/feitian/Logger_V1.00.03_20210811.jar')

    // Common dependencies
    implementation files('libs/json-simple-1.1.1.jar')
    implementation files('libs/Crypto_V1.00.03_20220812.jar')
    implementation files('libs/finger.jar')
    implementation files('libs/mvvmhabit-release.aar')
    implementation files('libs/SmartCardLib.jar')

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation "androidx.core:core-splashscreen:1.0.0"

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.12.5'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.5'
    implementation 'com.google.code.gson:gson:2.13.1'

    implementation 'javax.xml.stream:stax-api:1.0-2'
    implementation 'com.fasterxml.woodstox:woodstox-core:6.2.6'

    implementation 'androidx.room:room-runtime:2.7.1'
    annotationProcessor 'androidx.room:room-compiler:2.7.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}